
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Churn Prediction Result</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

.result-card {
    background: white;
    width: 100%;
    max-width: 520px;
    padding: 40px 30px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.06);
}

.result-card h1 {
    color: #172554;
    margin-bottom: 15px;
}

.result-text {
    font-size: 21px;
    font-weight: bold;
    margin: 25px 0;
}

.churn {
    color: #dc2626;
}

.stay {
    color: #16a34a;
}

.probability {
    margin-top: 25px;
    text-align: left;
}

.probability p {
    margin-bottom: 8px;
    font-weight: bold;
    font-size: 14px;
}

.bar {
    width: 100%;
    height: 13px;
    background: #e2e8f0;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 20px;
}

.fill {
    height: 100%;
    border-radius: 20px;
}

.churn-fill {
    background: #ef4444;
}

.stay-fill {
    background: #16a34a;
}

.back-btn {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 24px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

.back-btn:hover {
    background: #1d4ed8;
}
</style>
</head>

<body>

<div class="result-card">

<h1>Customer Churn Prediction</h1>

<p>Machine Learning Prediction Result</p>

<div class="result-text {{ status }}">
    {{ prediction }}
</div>

<div class="probability">

<p>Churn Probability: {{ churn_probability }}%</p>
<div class="bar">
    <div class="fill churn-fill"
         style="width: {{ churn_probability }}%;"></div>
</div>

<p>Stay Probability: {{ stay_probability }}%</p>
<div class="bar">
    <div class="fill stay-fill"
         style="width: {{ stay_probability }}%;"></div>
</div>

</div>

<a href="/" class="back-btn">Predict Another Customer</a>

</div>

</body>
</html>
